<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NXB Adaptive Observability</title>
<style>
:root{font-family:Inter,Segoe UI,system-ui,sans-serif;color-scheme:dark;background:#0d1117;color:#e6edf3}
*{box-sizing:border-box}body{margin:0;padding:24px;background:#0d1117}.wrap{max-width:1180px;margin:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.title{font-size:24px;font-weight:700}.muted{color:#8b949e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:16px}.value{font-size:24px;font-weight:700;margin-top:6px}.modes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button{background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:9px 12px;border-radius:8px;cursor:pointer}button:hover{border-color:#8b949e}.danger{border-color:#f85149}.active{border-color:#2f81f7;background:#1f3b5b}.pill{display:inline-block;border:1px solid #30363d;border-radius:999px;padding:4px 8px;margin:3px;font-size:12px}.ok{border-color:#3fb950}.pending{border-color:#d29922}.unavailable{border-color:#f85149}.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #21262d}.row:last-child{border-bottom:0}.adapter{border:1px solid #30363d;border-radius:9px;padding:10px;margin-top:8px}.adapter-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.asset{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;color:#8b949e;margin-top:3px}pre{white-space:pre-wrap;overflow:auto;background:#0d1117;padding:12px;border-radius:8px;border:1px solid #30363d;max-height:360px}.error{color:#f85149}.small{font-size:12px}.wide{grid-column:1/-1}</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="title">NXB Adaptive Observability</div><div class="muted">Local control plane · selective escalation · bounded evidence</div></div><div id="health" class="pill">connecting</div></div>
  <div class="grid">
    <div class="card"><div class="muted">Effective mode</div><div id="mode" class="value">—</div><div id="override" class="small muted"></div><div class="modes" id="modes"></div><div class="modes"><button class="danger" onclick="clearOverride()">Clear override</button></div></div>
    <div class="card"><div class="muted">Capture detail</div><div id="detail" class="value">—</div><div class="row"><span>Event/s</span><b id="eventRate">—</b></div><div class="row"><span>Disk MB/h</span><b id="disk">—</b></div><div class="row"><span>Session s</span><b id="session">—</b></div></div>
    <div class="card"><div class="muted">Active triggers</div><div id="triggers"></div></div>
    <div class="card"><div class="muted">Active domains</div><div id="domains"></div></div>
    <div class="card wide"><div class="muted">Capture adapters</div><div id="adapterSummary" class="small muted"></div><div id="adapters"></div></div>
    <div class="card wide"><div class="muted">Semantic hardening</div><div id="claims"></div></div>
    <div class="card wide"><div class="muted">Decision reasons</div><div id="reasons"></div></div>
    <div class="card wide"><div class="muted">Raw status</div><pre id="raw">—</pre></div>
  </div>
</div>
<script>
const MODES=['off','minimal','normal','deep','forensic'];
const PANEL_TOKEN='__NXB_PANEL_TOKEN__';
const MUTATION_HEADERS={'Content-Type':'application/json','X-NXB-Panel-Token':PANEL_TOKEN};
function pills(items,cls=''){return (items||[]).map(x=>`<span class="pill ${cls}">${escapeHtml(String(x))}</span>`).join('')||'<span class="muted">none</span>'}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function renderAdapters(manifest){const capture=manifest?.capture||{};const items=capture.domains||[];document.getElementById('adapterSummary').textContent=`ready ${capture.ready_count??0} · pending ${capture.pending_count??0} · unavailable ${capture.unavailable_count??0}`;document.getElementById('adapters').innerHTML=items.map(x=>{const cls=x.availability==='ready'?'ok':x.availability==='pending'?'pending':'unavailable';const assets=(x.assets||[]).map(a=>`<div class="asset">${a.repo_owned?'✓':'✗'} ${escapeHtml(a.path)}</div>`).join('')||'<div class="asset">no repo asset selected</div>';return `<div class="adapter"><div class="adapter-head"><b>${escapeHtml(x.domain)}</b><span class="pill ${cls}">${escapeHtml(x.availability)}</span></div><div class="small muted">${escapeHtml(x.adapter_kind)} · ${escapeHtml(x.runtime_surface)} · ${escapeHtml(x.reason)}</div>${assets}</div>`}).join('')||'<span class="muted">no active capture domain</span>'}
async function setOverride(mode){const seconds=Number(prompt('Override duration in seconds','300')||'0');if(!seconds)return;const r=await fetch('/api/override',{method:'POST',headers:MUTATION_HEADERS,body:JSON.stringify({mode,seconds})});if(!r.ok)throw new Error(await r.text());await refresh()}
async function clearOverride(){const r=await fetch('/api/clear',{method:'POST',headers:{'X-NXB-Panel-Token':PANEL_TOKEN}});if(!r.ok)throw new Error(await r.text());await refresh()}
function renderButtons(current){document.getElementById('modes').innerHTML=MODES.map(m=>`<button class="${m===current?'active':''}" onclick="setOverride('${m}')">${m}</button>`).join('')}
async function refresh(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw new Error(await r.text());const s=await r.json();document.getElementById('health').textContent='local · online';document.getElementById('health').className='pill ok';const p=s.plan||{};document.getElementById('mode').textContent=p.effective_mode||'—';renderButtons(p.effective_mode);document.getElementById('detail').textContent=p.detail||'—';document.getElementById('eventRate').textContent=p.budgets?.max_event_rate_per_second??'—';document.getElementById('disk').textContent=p.budgets?.max_disk_mb_per_hour??'—';document.getElementById('session').textContent=p.budgets?.max_session_seconds??'—';document.getElementById('triggers').innerHTML=pills(p.active_trigger_ids);document.getElementById('domains').innerHTML=pills(p.active_domains);renderAdapters(s.capture_manifest);document.getElementById('reasons').innerHTML=pills(p.reasons);const c=s.claim_targets||[];document.getElementById('claims').innerHTML=c.map(x=>`<span class="pill ${x.validated?'ok':'pending'}">${escapeHtml(x.name)} · target=${x.target_requested} · validated=${x.validated}</span>`).join('');document.getElementById('override').textContent=s.override?.active?`override: ${s.override.mode} until ${s.override.expires_utc}`:'automatic policy';document.getElementById('raw').textContent=JSON.stringify(s,null,2)}catch(e){document.getElementById('health').textContent='offline';document.getElementById('health').className='pill error';document.getElementById('raw').textContent=String(e)}}
refresh();setInterval(refresh,2000);
</script>
</body>
</html>
