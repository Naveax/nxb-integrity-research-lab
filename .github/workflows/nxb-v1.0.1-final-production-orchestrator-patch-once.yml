name: NXB v1.0.1 one-shot final production orchestrator patch

on:
  push:
    branches:
      - automation/nxb-v1.0.1-native-dispatch

permissions:
  contents: write

jobs:
  patch-final-production-orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/nxb-v1.0.1-release-integration-boundary-repair
          fetch-depth: 0
      - name: Apply exact final production orchestrator bindings
        shell: bash
        env:
          EXPECTED_HEAD: c28b51262d4b0b54cd40b35abf99f5ff2caed33d
          TARGET_BRANCH: release/nxb-v1.0.1-release-integration-boundary-repair
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "${actual}" != "${EXPECTED_HEAD}" ]]; then
            echo "Target branch drift: expected=${EXPECTED_HEAD} actual=${actual}" >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/Invoke-NxbV1ProductionRelease.ps1')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '[string]$signingPolicy.certified_implementation_head -ceq [string]$policy.implementation.certified_head',
                  '[string]$signingPolicy.certified_implementation_head -ceq [string]$policy.implementation.historical_certified_head',
                  1,
              ),
              (
                  'certified_implementation_head=[string]$policy.implementation.certified_head;',
                  'certified_implementation_head=$certified;',
                  1,
              ),
              (
                  '-CertifiedImplementationHead ([string]$policy.implementation.certified_head)',
                  '-CertifiedImplementationHead $certified',
                  1,
              ),
              (
                  "'--expected-certified-head',([string]$policy.implementation.certified_head)",
                  "'--expected-certified-head',$certified",
                  1,
              ),
              (
                  "Assert-Nxb ($null -ne $envelope -and [string]$envelope.signer_mode -ceq 'production-windows-certificate-store' -and [bool]$envelope.production_signer_claimed -and [string]$envelope.public_key.fingerprint -ceq [string]$policy.predecessor.production_signer_fingerprint) 'Production envelope signer/fingerprint boundary failed.'",
                  "Assert-Nxb ($null -ne $envelope -and [string]$envelope.certified_implementation_head -ceq $certified -and [string]$envelope.signer_mode -ceq 'production-windows-certificate-store' -and [bool]$envelope.production_signer_claimed -and [string]$envelope.public_key.fingerprint -ceq [string]$policy.predecessor.production_signer_fingerprint) 'Production envelope signer/fingerprint/certified-head boundary failed.'",
                  1,
              ),
              (
                  "Assert-Nxb ([string]$productionIndependent.status -ceq 'passed' -and [string]$productionIndependent.authority -ceq 'nxb-v1-production-signing-independent-v2' -and [string]$productionIndependent.expected_signer_mode -ceq 'production-windows-certificate-store' -and [int]$productionIndependent.requirements_validated -eq 12 -and [int]$productionIndependent.negative_controls_validated -eq 8 -and @($productionIndependent.failures).Count -eq 0) 'Independent production signing closure is not 12/12 + 8/8.'",
                  "Assert-Nxb ([string]$productionIndependent.status -ceq 'passed' -and [string]$productionIndependent.authority -ceq 'nxb-v1-production-signing-independent-v2' -and [string]$productionIndependent.certified_implementation_head -ceq $certified -and [string]$productionIndependent.expected_signer_mode -ceq 'production-windows-certificate-store' -and [int]$productionIndependent.requirements_validated -eq 12 -and [int]$productionIndependent.negative_controls_validated -eq 8 -and @($productionIndependent.failures).Count -eq 0) 'Independent production signing closure is not exact-head 12/12 + 8/8.'",
                  1,
              ),
              (
                  "$packageZip = Join-Path $distRoot ([string]$policy.package.zip_name)\nExport-NxbDeterministicZip -Root $packageRoot -Output $packageZip",
                  "$packageZip = Join-Path $distRoot ([string]$policy.package.zip_name)\nExport-NxbDeterministicZip -Root $packageRoot -Output $packageZip\n$packageZipReplay = Join-Path $releaseRoot 'nxb-v1.0.1-determinism-replay.zip'\nExport-NxbDeterministicZip -Root $packageRoot -Output $packageZipReplay\nAssert-Nxb ((Get-NxbSha256 -Path $packageZipReplay) -ceq (Get-NxbSha256 -Path $packageZip)) 'Deterministic package ZIP replay hash mismatch.'\nRemove-Item -LiteralPath $packageZipReplay -Force",
                  1,
              ),
          ]
          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'exact replacement cardinality drift: {old!r} expected={expected} actual={actual}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8', newline='')
          PY
          git diff --check
          test "$(git diff --name-only)" = "scripts/Invoke-NxbV1ProductionRelease.ps1"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/Invoke-NxbV1ProductionRelease.ps1
          git commit -m 'release: finalize certified-head and deterministic package bindings'
          git push origin HEAD:${TARGET_BRANCH}
