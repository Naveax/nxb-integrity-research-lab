$nativeArchiveSha = Save-NxbGitHubArtifactArchive -ArtifactId ([long]$nativeArtifact[0].id) -OutputPath $nativeArchive -ExpectedDigest ([string]$nativeArtifact[0].digest) -Token $ghToken
$ghToken = $null'''
          new_download=r'''$hostedArchiveSha = Save-NxbGitHubArtifactArchive -ArtifactId ([long]$hostedArtifact[0].id) -OutputPath $hostedArchive -ExpectedDigest ([string]$hostedArtifact[0].digest) -Token $ghToken
$nativeArchiveSha = Save-NxbGitHubArtifactArchive -ArtifactId ([long]$nativeArtifact[0].id) -OutputPath $nativeArchive -ExpectedDigest ([string]$nativeArtifact[0].digest) -Token $ghToken

