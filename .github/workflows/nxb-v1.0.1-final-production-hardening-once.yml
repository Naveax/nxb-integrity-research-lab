[void](Save-NxbGitHubReleaseAsset -AssetId ([long]$predecessorManifestAsset[0].id) -OutputPath $predecessorManifestPath -ExpectedSha256 $predecessorExpectedAssets['package-manifest.json'] -Token $ghToken)
