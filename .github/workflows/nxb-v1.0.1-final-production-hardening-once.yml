    return [pscustomobject][ordered]@{ release_id=[long]$release.id; tag=[string]$release.tag_name; draft=[bool]$release.draft; prerelease=[bool]$release.prerelease; assets=$assets }'''
          rep(script, old_snapshot, new_snapshot)

          rep(script,
