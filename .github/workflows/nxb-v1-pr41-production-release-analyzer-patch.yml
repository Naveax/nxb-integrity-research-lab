name: NXB v1 PR41 one-shot production release analyzer patch

on:
  push:
    branches:
      - release/nxb-v1.0.1-release-integration-boundary-repair

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci: one-shot patch production release analyzer findings'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/nxb-v1.0.1-release-integration-boundary-repair
          fetch-depth: 0
      - name: Apply exact analyzer/runtime patch and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/Invoke-NxbV1ProductionRelease.ps1')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('Get-NxbTrackedPaths', 'Get-NxbTrackedPath', 2),
              ('Get-NxbLiteralTrackedDependencies', 'Get-NxbLiteralTrackedDependency', 2),
              ('Get-NxbProductionSignerCandidates', 'Get-NxbProductionSignerCandidate', 2),
              ("            catch {}", "            catch { Write-Verbose ('Literal dependency candidate skipped: {0}' -f $_.Exception.Message) }", 1),
              (
                  "    Assert-Nxb (Test-Path -LiteralPath $reviewPath -PathType Leaf -and Test-Path -LiteralPath $sourcePath -PathType Leaf) ('Native review binding file missing: {0}' -f [string]$binding.Key)",
                  "    Assert-Nxb ((Test-Path -LiteralPath $reviewPath -PathType Leaf) -and (Test-Path -LiteralPath $sourcePath -PathType Leaf)) ('Native review binding file missing: {0}' -f [string]$binding.Key)",
                  1,
              ),
          ]
          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'exact replacement cardinality drift: {old!r} expected={expected} actual={actual}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8', newline='')
          Path('.github/workflows/nxb-v1-pr41-production-release-analyzer-patch.yml').unlink()
          PY
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/nxb-v1-pr41-production-release-analyzer-patch.yml scripts/Invoke-NxbV1ProductionRelease.ps1 "
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/Invoke-NxbV1ProductionRelease.ps1 .github/workflows/nxb-v1-pr41-production-release-analyzer-patch.yml
          git commit -m 'release: fix production orchestrator analyzer findings'
          git push origin HEAD:release/nxb-v1.0.1-release-integration-boundary-repair
