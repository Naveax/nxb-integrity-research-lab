name: NXB v1.0.1 hosted freeze observer

on:
  push:
    branches:
      - automation/nxb-v1.0.1-native-dispatch

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report exact-head workflow-dispatch run without redispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: release/nxb-v1.0.1-release-integration-boundary-repair
          TARGET_HEAD: 460d99850f1495cc4f73c965fb006d758c8b227d
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          encoded_branch="release%2Fnxb-v1.0.1-release-integration-boundary-repair"
          runs_json="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${api}/actions/workflows/nxb-v1-ci.yml/runs?event=workflow_dispatch&branch=${encoded_branch}&per_page=30")"
          row="$(TARGET_HEAD="${TARGET_HEAD}" python -c 'import json,os,sys; d=json.load(sys.stdin); h=os.environ["TARGET_HEAD"]; xs=[r for r in d.get("workflow_runs",[]) if r.get("head_sha")==h and r.get("event")=="workflow_dispatch"]; xs=sorted(xs,key=lambda r:r.get("created_at","") ,reverse=True); assert xs,"exact-head workflow_dispatch run not found"; r=xs[0]; print("%s|%s|%s|%s|%s"%(r["id"],r["run_number"],r["status"],r.get("conclusion") or "null",r["html_url"]))' <<<"${runs_json}")"
          IFS='|' read -r run_id run_number status conclusion url <<<"${row}"
          body=$(printf '<!-- nxb-hosted-freeze-observer:%s -->\n## Hosted freeze observer\n\n- run #%s / `%s` — `%s` / `%s`\n- exact head: `%s`\n- %s\n\nNo redispatch was performed.' "${TARGET_HEAD}" "${run_number}" "${run_id}" "${status}" "${conclusion}" "${TARGET_HEAD}" "${url}")
          gh api "repos/${GITHUB_REPOSITORY}/issues/42/comments" -f body="${body}" >/dev/null
