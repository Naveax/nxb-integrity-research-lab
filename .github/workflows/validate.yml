name: Validate

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis and smoke validation
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install JSON Schema validator
        shell: pwsh
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Guard public repository content
        shell: pwsh
        run: ./scripts/Test-PublicRepositoryContent.ps1

      - name: Validate WPR profile with native parser
        shell: pwsh
        run: |
          $wpr = Get-Command wpr.exe -ErrorAction Stop
          $profile = (Resolve-Path -LiteralPath ./profiles/Nxb.MinimalCpuScheduler.wprp).Path
          $output = & $wpr.Source -profiles $profile 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }

          if ($exitCode -ne 0) {
            throw "wpr.exe profile validation failed with exit code $exitCode."
          }

          $text = $output -join [Environment]::NewLine
          if ($text -notmatch 'NxbMinimalCpuScheduler') {
            throw 'wpr.exe did not enumerate NxbMinimalCpuScheduler from the repository profile.'
          }

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Import-Module PSScriptAnalyzer -Force

      - name: Analyze PowerShell
        shell: pwsh
        run: |
          $results = @(
            foreach ($path in @('./scripts', './tests')) {
              Invoke-ScriptAnalyzer `
                -Path $path `
                -Recurse `
                -Settings ./.github/PSScriptAnalyzerSettings.psd1
            }
          ) | Sort-Object ScriptName, Line, Column, RuleName

          $summary = [System.Collections.Generic.List[string]]::new()
          $summary.Add('## PSScriptAnalyzer results') | Out-Null
          $summary.Add('') | Out-Null

          if ($results.Count -eq 0) {
            $summary.Add('No Error or Warning findings.') | Out-Null
          }
          else {
            $summary.Add('| Severity | File | Line | Rule | Message |') | Out-Null
            $summary.Add('|---|---|---:|---|---|') | Out-Null
          }

          foreach ($result in $results) {
            $scriptName = if ([string]::IsNullOrWhiteSpace([string]$result.ScriptName)) {
              '<unknown>'
            }
            else {
              [string]$result.ScriptName
            }

            $line = [int]$result.Line
            $column = [int]$result.Column
            $severity = [string]$result.Severity
            $rule = [string]$result.RuleName
            $message = ([string]$result.Message).Replace("`r", ' ').Replace("`n", ' ')

            Write-Host ("ANALYZER|{0}|{1}|{2}|{3}|{4}|{5}" -f `
              $severity, $scriptName, $line, $column, $rule, $message)

            $annotationMessage = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host ("::warning file={0},line={1},col={2},title={3}::{4}" -f `
              $scriptName, $line, $column, $rule, $annotationMessage)

            $tableMessage = $message.Replace('|', '\|')
            $summary.Add("| $severity | $scriptName | $line | $rule | $tableMessage |") | Out-Null
          }

          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

          if ($results.Count -gt 0) {
            throw "PSScriptAnalyzer reported $($results.Count) issue(s)."
          }

      - name: Repository smoke validation
        shell: pwsh
        run: ./scripts/Test-Repository.ps1

  lifecycle-powershell-7:
    name: Lifecycle - PowerShell 7
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install JSON Schema validator
        shell: pwsh
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Install Pester 5
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.5.0 -Force

      - name: Run Pester
        shell: pwsh
        run: Invoke-Pester -Path ./tests -CI

  lifecycle-windows-powershell-5-1:
    name: Lifecycle - Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install JSON Schema validator
        shell: powershell
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Install Pester 5
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.5.0 -Force

      - name: Run Pester
        shell: powershell
        run: Invoke-Pester -Path ./tests -CI
