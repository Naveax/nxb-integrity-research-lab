name: NXB v1.0.1 cleanup stale bridge run

on:
  push:
    branches:
      - automation/nxb-v1.0.1-native-dispatch

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel stale non-NXB bridge run only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_RUN_ID: '32019680353'
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          run="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/actions/runs/${STALE_RUN_ID}")"
          branch="$(python -c 'import json,sys; print(json.load(sys.stdin)["head_branch"])' <<<"${run}")"
          name="$(python -c 'import json,sys; print(json.load(sys.stdin)["name"])' <<<"${run}")"
          if [[ "${branch}" != "automation/nxb-v1.0.1-native-dispatch" || "${name}" != "NXB v1.0.1 one-shot native runner label bridge" ]]; then
            echo "Refusing to cancel unexpected run: branch=${branch} name=${name}" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/actions/runs/${STALE_RUN_ID}/cancel"
          echo "Cancelled stale bridge run ${STALE_RUN_ID}."
