name: One-time PowerShell encoding normalization

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  normalize:
    name: Normalize PowerShell sources to UTF-8 BOM
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@v4
        with:
          ref: nxb-irl-002-closeout
          fetch-depth: 0

      - name: Normalize source encoding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8Bom = [System.Text.UTF8Encoding]::new($true)
          $files = Get-ChildItem -Path ./scripts, ./tests -Recurse -File |
            Where-Object { $_.Extension -in @('.ps1', '.psm1') } |
            Sort-Object FullName

          foreach ($file in $files) {
            $text = [System.IO.File]::ReadAllText($file.FullName)
            [System.IO.File]::WriteAllText($file.FullName, $text, $utf8Bom)
          }

          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            if ($bytes.Length -lt 3 -or
                $bytes[0] -ne 0xEF -or
                $bytes[1] -ne 0xBB -or
                $bytes[2] -ne 0xBF) {
              throw "UTF-8 BOM doğrulaması başarısız: $($file.FullName)"
            }
          }

          $changed = @(git diff --name-only)
          $unexpected = @($changed | Where-Object {
            $_ -notmatch '^(scripts|tests)/.+\.(ps1|psm1)$'
          })

          if ($unexpected.Count -gt 0) {
            throw "Beklenmeyen dosya değişikliği:`n$($unexpected -join "`n")"
          }

          if ($changed.Count -eq 0) {
            Write-Host 'PowerShell dosyaları zaten UTF-8 BOM biçiminde.'
            exit 0
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts tests
          git commit -m 'chore: normalize PowerShell sources to UTF-8 BOM'
          git push origin HEAD:nxb-irl-002-closeout

      - name: Trigger validation on normalized branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run validate.yml --ref nxb-irl-002-closeout
