name: NXB v1.0.1 one-shot production orchestrator patch

on:
  push:
    branches:
      - automation/nxb-v1.0.1-native-dispatch

permissions:
  contents: write

jobs:
  patch-production-orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/nxb-v1.0.1-release-integration-boundary-repair
          fetch-depth: 0
      - name: Apply exact fail-closed analyzer fixes
        shell: bash
        env:
          EXPECTED_HEAD: dfa690dcf114a59207c587a6e5348ee5d8590956
          TARGET_BRANCH: release/nxb-v1.0.1-release-integration-boundary-repair
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "${actual}" != "${EXPECTED_HEAD}" ]]; then
            echo "Target branch drift: expected=${EXPECTED_HEAD} actual=${actual}" >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/Invoke-NxbV1ProductionRelease.ps1')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('Get-NxbTrackedPaths', 'Get-NxbTrackedPath', 2),
              ('Get-NxbLiteralTrackedDependencies', 'Get-NxbLiteralTrackedDependency', 2),
              ('Get-NxbProductionSignerCandidates', 'Get-NxbProductionSignerCandidate', 2),
              ("            catch {}", "            catch { Write-Verbose ('Literal dependency candidate skipped: {0}' -f $_.Exception.Message) }", 1),
              (
                  "    Assert-Nxb (Test-Path -LiteralPath $reviewPath -PathType Leaf -and Test-Path -LiteralPath $sourcePath -PathType Leaf) ('Native review binding file missing: {0}' -f [string]$binding.Key)",
                  "    Assert-Nxb ((Test-Path -LiteralPath $reviewPath -PathType Leaf) -and (Test-Path -LiteralPath $sourcePath -PathType Leaf)) ('Native review binding file missing: {0}' -f [string]$binding.Key)",
                  1,
              ),
          ]
          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'exact replacement cardinality drift: {old!r} expected={expected} actual={actual}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8', newline='')
          PY
          git diff --check
          changed="$(git diff --name-only)"
          test "${changed}" = "scripts/Invoke-NxbV1ProductionRelease.ps1"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/Invoke-NxbV1ProductionRelease.ps1
          git commit -m 'release: fix production orchestrator analyzer findings'
          git push origin HEAD:${TARGET_BRANCH}
