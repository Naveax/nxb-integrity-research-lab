name: NXB v1.0.1 Native Dispatch Once

on:
  push:
    branches:
      - automation/nxb-v1.0.1-native-dispatch

permissions:
  contents: read
  actions: write

jobs:
  dispatch-native:
    runs-on: ubuntu-latest
    steps:
      - name: Deduplicate and dispatch exact-head native run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: release/nxb-v1.0.1-release-integration-boundary-repair
          EXPECTED_HEAD: 395ce3a92e3650ea3dc0141524926e64810a82c8
          WORKFLOW_FILE: nxb-v1-ci.yml
        run: |
          set -euo pipefail

          remote_head="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          if [[ -z "${remote_head}" || "${remote_head}" != "${EXPECTED_HEAD}" ]]; then
            echo "Target head drift: expected=${EXPECTED_HEAD} actual=${remote_head:-missing}" >&2
            exit 21
          fi

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?event=workflow_dispatch&branch=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["TARGET_BRANCH"], safe=""))')&per_page=100"
          runs_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}")"

          existing="$(jq -r --arg head "${EXPECTED_HEAD}" '.workflow_runs[] | select(.head_sha == $head) | [.id,.status,(.conclusion // "null"),.html_url] | @tsv' <<<"${runs_json}")"
          if [[ -n "${existing}" ]]; then
            echo "Exact-head workflow_dispatch already exists; refusing duplicate dispatch."
            echo "${existing}"
            exit 0
          fi

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/dispatches" \
            -d "$(jq -nc --arg ref "${TARGET_BRANCH}" '{ref:$ref,inputs:{run_native:"true"}}')"

          echo "Dispatched one exact-head native run for ${EXPECTED_HEAD}."
