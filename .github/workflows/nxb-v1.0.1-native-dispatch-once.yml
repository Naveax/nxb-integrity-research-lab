name: NXB v1.0.1 one-shot native discovery

on:
  push:
    branches:
      - automation/nxb-v1.0.1-native-dispatch

permissions:
  actions: read
  contents: write

jobs:
  discover-native:
    if: github.event.head_commit.message != 'Record exact-head native dispatch result'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discover exact-head workflow-dispatch run and record receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: release/nxb-v1.0.1-release-integration-boundary-repair
          TARGET_HEAD: 0233fdb1f05b5c8be41f6303758f16c34a17571a
          RESULT_PATH: nxb-v1.0.1-native-dispatch-result.json
          OPERATIONAL_BRANCH: automation/nxb-v1.0.1-native-dispatch
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          encoded_branch="release%2Fnxb-v1.0.1-release-integration-boundary-repair"
          runs_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/actions/workflows/nxb-v1-ci.yml/runs?event=workflow_dispatch&branch=${encoded_branch}&per_page=20")"
          result="$(python -c 'import json,sys; d=json.load(sys.stdin); h="0233fdb1f05b5c8be41f6303758f16c34a17571a"; xs=[r for r in d.get("workflow_runs",[]) if r.get("head_sha")==h and r.get("event")=="workflow_dispatch"]; xs=sorted(xs,key=lambda r:r.get("created_at","") ,reverse=True); assert len(xs)>=1,"exact-head workflow_dispatch run not found"; r=xs[0]; assert int(r.get("run_number",0))>=61,"unexpected run number"; print(json.dumps({"schema_version":1,"status":"found","authority":"nxb-v1-native-dispatch-discovery-v1","run_id":r["id"],"run_number":r["run_number"],"run_attempt":r["run_attempt"],"workflow_name":r["name"],"event":r["event"],"head_branch":r["head_branch"],"head_sha":r["head_sha"],"run_status":r["status"],"run_conclusion":r.get("conclusion")},sort_keys=True,separators=(",",":")))' <<<"${runs_json}")"
          content="$(printf '%s\n' "${result}" | base64 -w0)"
          payload="$(python -c 'import json,os; print(json.dumps({"message":"Record exact-head native dispatch result","content":os.environ["CONTENT"],"branch":os.environ["OPERATIONAL_BRANCH"]},separators=(",",":")))' CONTENT="${content}" 2>/dev/null || true)"
          if [[ -z "${payload}" ]]; then
            payload="$(CONTENT="${content}" OPERATIONAL_BRANCH="${OPERATIONAL_BRANCH}" python -c 'import json,os; print(json.dumps({"message":"Record exact-head native dispatch result","content":os.environ["CONTENT"],"branch":os.environ["OPERATIONAL_BRANCH"]},separators=(",",":")))')"
          fi
          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/contents/${RESULT_PATH}" \
            -d "${payload}" >/dev/null
          echo "Recorded exact-head native run discovery."
