name: NXB v1.0.1 one-shot native dispatch

on:
  push:
    branches:
      - automation/nxb-v1.0.1-native-dispatch

permissions:
  actions: write
  contents: read

jobs:
  dispatch-native:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact repair head and dispatch native gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: release/nxb-v1.0.1-release-integration-boundary-repair
          TARGET_HEAD: 0233fdb1f05b5c8be41f6303758f16c34a17571a
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          encoded_branch="release%2Fnxb-v1.0.1-release-integration-boundary-repair"
          ref_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/git/ref/heads/${encoded_branch}")"
          actual="$(python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])' <<<"${ref_json}")"
          if [[ "${actual}" != "${TARGET_HEAD}" ]]; then
            echo "Exact repair head drift: expected=${TARGET_HEAD} actual=${actual}" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/actions/workflows/nxb-v1-ci.yml/dispatches" \
            -d '{"ref":"release/nxb-v1.0.1-release-integration-boundary-repair","inputs":{"run_native":"true"}}'
          echo "Dispatched NXB v1 CI native gate for ${TARGET_HEAD}."
